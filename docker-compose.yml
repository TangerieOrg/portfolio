name: portfolio

services:
    frontend:
        build: ./web
        image: portfolio-frontend:latest
        pull_policy: never
        restart: unless-stopped
        networks:
            - traefik-proxy
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=traefik-proxy"
            - "traefik.http.routers.portfolio.rule=PathPrefix(`/`)"
            - "traefik.http.routers.portfolio.entrypoints=web,websecure"
            - "traefik.http.routers.portfolio.priority=1"
            - "traefik.http.services.portfolio.loadbalancer.server.port=3000"

networks:
    traefik-proxy:
        external: true
